<!doctype html>
<html lang="en" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/claude-star.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Claude — a luxurious AI companion. Thoughtful, nuanced conversation in an interface crafted like haute couture."
    />
    <title>Claude — Luxury AI Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("claude-theme");
        if (t === "ivory" || t === "noir") {
          document.documentElement.setAttribute("data-theme", t);
        }
        document.documentElement.style.colorScheme =
          document.documentElement.getAttribute("data-theme") === "ivory"
            ? "light"
            : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
